<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Sonora</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=35">
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <canvas id="out" tabindex="0" aria-label="Sonora"></canvas>
      <div class="topbar" id="topbar">
        <div class="blur prev" id="topbarPrev" aria-hidden="true">
          <span class="l1"></span><span class="l2"></span><span class="l3"></span><span class="l4"></span><span class="l5"></span><span class="l6"></span><span class="tint"></span>
        </div>
        <div class="blur curr" id="topbarCurr" aria-hidden="true">
          <span class="l1"></span><span class="l2"></span><span class="l3"></span><span class="l4"></span><span class="l5"></span><span class="l6"></span><span class="tint"></span>
        </div>
      </div>
      <canvas id="top" aria-hidden="true"></canvas>

      <div id="sonoraPrompt" class="prompt-backdrop" role="dialog" aria-modal="true" aria-labelledby="promptTitle" style="display:none;" aria-hidden="true">
        <div class="prompt-sheet">
          <div class="prompt-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
          <div class="prompt-title" id="promptTitle" data-i18n="prompt.new_playlist_title">Nuova playlist</div>
          <div class="prompt-sub" id="promptSub" data-i18n="prompt.new_playlist_sub">Crea una nuova raccolta personale</div>
          <div class="prompt-notes" id="promptNotes" style="display:none;"></div>
          <input type="text" class="prompt-input" id="promptInput" placeholder="Titolo della playlist" data-i18n-placeholder="prompt.playlist_placeholder" autocomplete="off" autocapitalize="sentences" spellcheck="false">
          <div class="prompt-progress-wrap" id="promptProgressWrap" style="display:none;">
            <div class="prompt-progress-track">
              <div class="prompt-progress-fill" id="promptProgressFill"></div>
            </div>
            <div class="prompt-progress-label" id="promptProgressLabel"></div>
          </div>
          <div class="prompt-btns" id="promptBtns">
            <button type="button" class="prompt-btn prompt-btn-cancel" id="promptCancel" data-i18n="prompt.cancel">Annulla</button>
            <button type="button" class="prompt-btn prompt-btn-confirm" id="promptConfirm" data-i18n="prompt.create">Crea</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Cerca" data-i18n-aria="nav.search_aria">
  <input id="fPlaylistCover" type="file" accept="image/*" style="display:none" aria-hidden="true">

  <script src="js/liquid-glass.js?v=35"></script>
  <script src="js/gfx.js?v=35"></script>
  <script src="js/i18n.js?v=36"></script>
  <script src="js/state.js?v=35"></script>
  <script src="js/pages.js?v=35"></script>
  <script src="js/player-sheet.js?v=35"></script>
  <script src="js/ui-overlay.js?v=35"></script>
  <script src="js/live.js?v=35"></script>
</body>
</html>
